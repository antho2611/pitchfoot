name: PitchPro
options:
  bundleIdPrefix: com.pitchpro
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.0.0

targets:
  PitchPro:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: PitchPro/Sources
      - path: PitchPro/Resources
    dependencies:
      - package: Supabase
    info:
      path: Generated-Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: PitchPro
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleURLName: com.pitchpro.native
            CFBundleURLSchemes:
              - pitchpro
        UIAppFonts:
          - BebasNeue-Regular.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pitchpro.native
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
